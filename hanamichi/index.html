<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2A2350">
  <meta name="description" content="Hanamichi: duelos anime en 3D sobre una azotea al atardecer.">
  <title>Hanamichi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icono.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/dela-gothic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/estilo.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <main class="juego" id="juego">
    <canvas id="lienzo" aria-hidden="true"></canvas>

    <!-- Efectos de pantalla -->
    <div class="lineas" id="lineas" aria-hidden="true"></div>
    <div class="mira-franco" id="miraFranco" hidden aria-hidden="true"></div>
    <div class="dano-borde" id="danoBorde" aria-hidden="true"></div>

    <!-- HUD -->
    <div class="hud" id="hud" hidden>
      <div class="duelo" aria-label="Marcador">
        <div class="duelo-lado duelo-yo"><span class="duelo-nombre">Tú</span><span class="pips" id="pipsYo"></span></div>
        <div class="duelo-tiempo" id="tiempo">1:20</div>
        <div class="duelo-lado duelo-rival"><span class="pips" id="pipsRival"></span><span class="duelo-nombre" id="nombreRival">Rin</span></div>
      </div>

      <div class="cruz" id="cruz" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="marca" id="marca" aria-hidden="true"></div>
      <div class="direccion" id="direccion" aria-hidden="true"></div>
      <div class="numeros" id="numeros" aria-hidden="true"></div>

      <div class="vida" aria-label="Vida">
        <span class="vida-num" id="vidaNum">100</span>
        <div class="vida-barra"><i id="vidaBarra"></i><b id="vidaFantasma"></b></div>
      </div>

      <div class="arma">
        <div class="arma-municion"><span id="municion">30</span><small id="cargador">/ 30</small></div>
        <div class="arma-nombre" id="armaNombre">Rifle Hikari</div>
        <ol class="ranuras" id="ranuras"></ol>
      </div>

      <button class="btn-pausa" id="btnPausa" type="button" aria-label="Pausar">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
      </button>
      <div class="aviso" id="aviso" aria-live="polite"></div>
      <div class="cuenta" id="cuenta" aria-live="polite"></div>
    </div>

    <!-- Controles táctiles -->
    <div class="tactil" id="tactil" hidden>
      <button type="button" class="t-btn t-disparar" data-accion="disparar" aria-label="Disparar"></button>
      <button type="button" class="t-btn t-saltar" data-accion="saltar" aria-label="Saltar">Saltar</button>
      <button type="button" class="t-btn t-agachar" data-accion="agachar" aria-label="Deslizar o agacharse">Deslizar</button>
      <button type="button" class="t-btn t-apuntar" data-accion="apuntar" aria-label="Apuntar">Apuntar</button>
      <button type="button" class="t-btn t-recargar" data-accion="recargar" aria-label="Recargar">Recargar</button>
      <button type="button" class="t-btn t-arma" data-accion="siguiente" aria-label="Cambiar de arma">Arma</button>
      <button type="button" class="t-btn t-granada" data-accion="granada" aria-label="Lanzar granada">Granada</button>
    </div>

    <!-- Menú principal -->
    <section class="pantalla menu" id="pMenu">
      <div class="titulo">
        <span class="kanji" aria-hidden="true">花道</span>
        <h1>Hanamichi</h1>
        <p class="lema">Duelos uno contra uno en una azotea al atardecer. Gana quien se lleve cinco rondas.</p>
      </div>
      <div class="panel">
        <h2 class="panel-titulo">Elige tu arma</h2>
        <div class="armas" id="armas" role="radiogroup" aria-label="Arma principal"></div>
        <h2 class="panel-titulo">Rival</h2>
        <div class="segmentos" id="dificultad" role="radiogroup" aria-label="Dificultad">
          <button type="button" data-v="facil">Tranquilo</button>
          <button type="button" data-v="normal">Equilibrado</button>
          <button type="button" data-v="dificil">Implacable</button>
        </div>
        <button class="btn btn-principal" id="btnJugar" type="button">Empezar duelo</button>
        <div class="menu-pie">
          <button class="btn-texto" id="btnAjustes" type="button">Ajustes</button>
          <button class="btn-texto" type="button" disabled title="Llegará con la conexión a Supabase">Duelo online (pronto)</button>
        </div>
        <p class="stats" id="statsMenu"></p>
      </div>
    </section>

    <!-- Pausa -->
    <section class="pantalla velo" id="pPausa" hidden>
      <div class="caja">
        <h2 class="grande">Pausa</h2>
        <button class="btn btn-principal" id="btnSeguir" type="button">Seguir</button>
        <button class="btn btn-sec" id="btnAjustesPausa" type="button">Ajustes</button>
        <button class="btn btn-sec" id="btnAbandonar" type="button">Abandonar duelo</button>
        <dl class="ayuda" id="ayuda"></dl>
      </div>
    </section>

    <!-- Ajustes -->
    <section class="pantalla velo" id="pAjustes" hidden>
      <div class="caja">
        <h2 class="grande">Ajustes</h2>
        <label class="ajuste">Sensibilidad <input type="range" id="ajSens" min="0.3" max="2.5" step="0.05"><output id="ajSensV"></output></label>
        <label class="ajuste">Volumen <input type="range" id="ajVol" min="0" max="1" step="0.05"><output id="ajVolV"></output></label>
        <div class="ajuste">Cámara
          <div class="segmentos mini" id="ajCam"><button type="button" data-v="tercera">Tercera persona</button><button type="button" data-v="primera">Primera persona</button></div>
        </div>
        <div class="ajuste">Calidad
          <div class="segmentos mini" id="ajCal"><button type="button" data-v="auto">Automática</button><button type="button" data-v="alta">Alta</button><button type="button" data-v="baja">Ligera</button></div>
        </div>
        <button class="btn btn-principal" id="btnCerrarAjustes" type="button">Listo</button>
      </div>
    </section>

    <!-- Final -->
    <section class="pantalla velo" id="pFin" hidden>
      <div class="caja fin">
        <h2 class="grande" id="finTitulo">Victoria</h2>
        <p class="fin-marcador" id="finMarcador">5 – 3</p>
        <dl class="fin-stats" id="finStats"></dl>
        <p class="stats" id="finRacha"></p>
        <button class="btn btn-principal" id="btnRevancha" type="button">Revancha</button>
        <button class="btn btn-sec" id="btnMenu" type="button">Volver al menú</button>
      </div>
    </section>

    <div class="carga" id="carga">Preparando la azotea…</div>
  </main>
  <noscript>Hanamichi necesita JavaScript y WebGL.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
